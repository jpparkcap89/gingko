  --shadow:0 20px 60px rgba(67,89,146,.16); --shadow-sm:0 8px 24px rgba(50,68,110,.08);
  --bg1:#f8fbff; --bg2:#fffdf7; --bg3:#f8fffc; --blob:1;
  --grad:linear-gradient(100deg,#3b63f6 0%,#38bdf8 52%,#f59e0b 100%);
  --r-xl:34px; --r-lg:26px; --r-md:16px; --r-sm:14px; --r-pill:999px;
  --font:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;

  /* Lucian UX/UI token mapping (cap89-style §6) */

  --ux-ink:#24324a; --ux-ink-2:#667085; --ux-ink-3:#98a2b3;
  --ux-line:rgba(36,50,74,.07); --ux-line-2:rgba(36,50,74,.15);
  --ux-accent:#3b63f6; --ux-accent-2:#38bdf8; --ux-accent-soft:rgba(59,99,246,.12); --ux-accent-ink:#ffffff;
  --ux-mint:#2bb39a; --ux-warn:#f59e0b; --ux-danger:#e5486b;
  --ux-glass:rgba(255,255,255,.72); --ux-glass-line:rgba(255,255,255,.95);
  --ux-shadow:rgba(67,89,146,.16); --ux-shadow-strong:rgba(67,89,146,.32);

}

  --ux-shadow:rgba(0,0,0,.45); --ux-shadow-strong:rgba(0,0,0,.7);
  --ux-grad:linear-gradient(100deg,#7b9bff 0%,#38bdf8 52%,#ffcf70 100%);

:root[data-theme="dark"]{
  --ink:#eef2ff; --muted:#a3adc2; --primary:#7b9bff; --primary-hover:#9bb3ff;
  --panel:rgba(255,255,255,.07); --panel-line:rgba(255,255,255,.12); --hairline:rgba(255,255,255,.09);
  --tile:rgba(255,255,255,.06); --primary-soft:rgba(123,155,255,.16); --on-primary:#0d1424;

  --shadow:0 20px 60px rgba(0,0,0,.35); --shadow-sm:0 8px 24px rgba(0,0,0,.25);
  --bg1:#0d1424; --bg2:#101829; --bg3:#0d1622; --blob:.3;
  --grad:linear-gradient(100deg,#7b9bff 0%,#38bdf8 52%,#ffcf70 100%);
  --ux-page:#0d1424; --ux-surface:#151e33; --ux-surface-2:#1c2740; --ux-surface-3:#26324f;
  --ux-ink:#eef2ff; --ux-ink-2:#a3adc2; --ux-ink-3:#6f7a93;
  --ux-line:rgba(255,255,255,.08); --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#7b9bff; --ux-accent-2:#38bdf8; --ux-accent-soft:rgba(123,155,255,.16); --ux-accent-ink:#0d1424;

/* ---------- page ---------- */
*{box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg1)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.blobs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:var(--blob)}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);animation:float 8s ease-in-out infinite}
.blobs i:nth-child(1){width:38vw;height:38vw;left:-8vw;top:4vh;background:rgba(255,207,112,.45)}
.blobs i:nth-child(2){width:36vw;height:36vw;right:-8vw;top:-6vh;background:rgba(127,216,201,.45);animation-duration:9s}
.blobs i:nth-child(3){width:32vw;height:32vw;right:12vw;bottom:-10vh;background:rgba(255,159,181,.3);animation-duration:7s}
@keyframes float{50%{transform:translate(10px,-18px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--hairline)}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{min-width:0;display:flex;align-items:center;gap:12px}
.mark{flex:none;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#3b63f6,#8e9cff);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;box-shadow:0 10px 25px rgba(59,99,246,.28)}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.028em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs-scroll{margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px}
.tabs-scroll::-webkit-scrollbar{display:none}
.dl-chip{flex:none;height:42px;padding:0 16px;border-radius:var(--r-pill);border:1px solid rgba(23,144,90,.25);background:var(--ok-soft);color:var(--ok);font-size:15px;font-weight:650;white-space:nowrap;transition:.2s}
.dl-chip:hover{transform:translateY(-2px)}
.tocbtn{display:none}
.mini-timer{flex:none;display:none;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-pill);background:var(--warm-soft);border:1px solid rgba(245,158,11,.3);color:var(--warm);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;border-width:1px}
.mini-timer.on{display:inline-flex}
.mini-timer.done{background:var(--ok-soft);color:var(--ok);border-color:rgba(23,144,90,.3)}
.bar{height:4px;background:var(--hairline)}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:0 4px 4px 0;transition:width .35s cubic-bezier(.2,.8,.2,1)}

/* main */
.wrap{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;padding-block:28px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.stage{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--panel-line);border-radius:var(--r-xl);box-shadow:var(--shadow);min-height:min(620px,calc(100vh - 230px));padding:clamp(24px,5vw,56px) clamp(20px,4.4vw,52px);display:flex;flex-direction:column;justify-content:center}
.card.top-align{justify-content:flex-start}
.card .in{animation:pageIn .5s ease both}
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border-radius:var(--r-pill);padding:8px 15px;background:var(--tile);backdrop-filter:blur(10px);border:1px solid rgba(59,99,246,.14);color:var(--primary);font-size:14px;font-weight:750;box-shadow:var(--shadow-sm);margin-bottom:20px}
.eyebrow{font-size:12.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:10px}
h1.t{font-size:clamp(25px,3.6vw,40px);line-height:1.3;letter-spacing:-.028em;font-weight:850;margin:0 0 14px;text-wrap:balance}
.card.section h1.t{font-size:clamp(27px,4.4vw,44px)}
h1.t .g{display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,1.7vw,19px);color:var(--muted);margin:0 0 24px;max-width:44em}
.body{display:flex;flex-direction:column;gap:16px;max-width:50em;font-size:17px}
.body p{margin:0}
.body strong{color:var(--ink);font-weight:750}
.body ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.body ul li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 16px;background:var(--tile);border:1px solid var(--hairline);border-radius:var(--r-md);transition:.2s}
.body ul li::before{content:"";width:8px;height:8px;margin:10px 0 0 6px;border-radius:50%;background:var(--primary)}
.body ul li:hover,.steps li:hover{transform:translateY(-2px)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--tile);border:1px solid var(--hairline);border-radius:var(--r-md);transition:.2s}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:15px}
.steps b{font-size:17px;font-weight:700}
.steps small{color:var(--muted);font-size:14.5px;line-height:1.6}
.tip{padding:14px 18px;border-radius:var(--r-md);background:var(--warm-soft);border:1px solid rgba(245,158,11,.22);font-size:15.5px}
.tip b{color:var(--warm)}
.linkbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);text-decoration:none;font-weight:650;font-size:15px;border-radius:var(--r-pill);padding:13px 22px;transition:.2s}
.linkbtn:hover{background:var(--primary-hover);transform:translateY(-2px)}
.linkbtn.disabled{background:var(--tile);color:var(--muted);border:1px solid var(--hairline);pointer-events:none}
.copy-list{display:grid;gap:22px;margin-top:8px}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav button{border-radius:var(--r-pill);padding:15px;font-size:15px;font-weight:650;border:1px solid var(--panel-line);background:var(--panel);backdrop-filter:blur(20px);color:var(--primary);box-shadow:var(--shadow-sm);transition:.2s}
.nav .next{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.nav .next:hover{background:var(--primary-hover)}
.nav button:not(:disabled):hover{transform:translateY(-2px)}
.nav button:disabled{opacity:.4;cursor:default}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:0}
kbd{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--hairline);border-radius:6px;padding:0 6px;background:var(--tile)}

/* toc */
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);align-self:start;max-height:calc(100vh - 120px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--panel-line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.toc-head{padding:18px 20px 14px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.toc-head small{display:block;font-size:11.5px;font-weight:750;letter-spacing:.08em;color:var(--muted)}
.toc-head b{font-size:17px;font-weight:800}
.toc-head p{margin:4px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc-head p strong{color:var(--primary)}
.toc-close{display:none;border:0;background:none;font-size:24px;line-height:1;padding:2px 6px;color:var(--muted)}
.toc-list{overflow-y:auto;padding:6px 10px 12px}
.toc-sec{font-size:12.5px;font-weight:750;color:var(--muted);padding:14px 10px 6px}
.toc-item{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.45;transition:background-color .2s}
.toc-item:hover{background:var(--primary-soft)}
.toc-item .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.toc-item.seen .n{color:var(--ok);font-size:13px;font-weight:800}
.toc-item[aria-current="true"]{background:var(--primary);color:var(--on-primary);font-weight:700;box-shadow:0 8px 20px rgba(59,99,246,.25)}
.toc-item[aria-current="true"] .n{color:var(--on-primary)}
.toc-item.dlrow:not([aria-current="true"]){background:var(--ok-soft)}
.tag{font-size:11px;font-weight:750;background:var(--ok);color:#fff;border-radius:var(--r-pill);padding:1px 8px}
.toc-foot{border-top:1px solid var(--hairline);padding:10px 20px}
.toc-foot button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12.5px}
.foot{grid-column:1/-1;text-align:center;font-size:13px;color:var(--muted);margin:8px 0 0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg1);padding:10px 20px;border-radius:var(--r-pill);font-size:14px;font-weight:650;box-shadow:var(--shadow);transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

<script>

  /* ---- Lucian #039 sliding pill tabs (header sections) ---- */
  const secTabs = (function(root){
    const bar = root.querySelector('.u039-tabs');
    const pill = root.querySelector('.u039-pill');

      const b = document.createElement('button');
      b.className='u039-tab'; b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected','false'); b.textContent=name;
      bar.appendChild(b);
    });
    const tabs = Array.prototype.slice.call(root.querySelectorAll('.u039-tab'));
    let sel = 0;
    function movePill(animate){
      const t = tabs[sel]; if(!t) return;
      if(!animate) pill.style.transition='none';
      pill.style.setProperty('--x', t.offsetLeft+'px');
      pill.style.setProperty('--w', t.offsetWidth+'px');
      if(!animate){ void pill.offsetWidth; pill.style.transition=''; }
    }
    function mark(i, animate){
      sel = i;
      tabs.forEach((t,k)=>{ t.setAttribute('aria-selected', String(k===i)); t.tabIndex = k===i?0:-1; });
      movePill(animate);
      const t = tabs[i], sc = root.parentElement;
      if(sc && (t.offsetLeft < sc.scrollLeft || t.offsetLeft + t.offsetWidth > sc.scrollLeft + sc.clientWidth)) sc.scrollTo({left:t.offsetLeft-20, behavior:'smooth'});
    }
    tabs.forEach((t,i)=>{
      t.addEventListener('click', ()=>go(firstOf(sections[i])));
      t.addEventListener('keydown', e=>{
        const d = e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
        if(d){ e.preventDefault(); e.stopPropagation(); const n=(i+d+tabs.length)%tabs.length; go(firstOf(sections[n])); tabs[n].focus(); }
      });
    });
    window.addEventListener('resize', ()=>movePill(false));
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>movePill(false));
    return { mark };
  })($("secTabs"));

  /* ---- Lucian #008 copy button, one per prompt ---- */

  function copyMarkup(text){

      <div class="ux u008 prompt"><div class="u008-box"><div class="u008-code"><b class="u008-cmd">${esc(text)}</b></div>
      <button class="u008-btn" type="button" aria-label="프롬프트 복사">${COPY_SVG}</button><span class="u008-tip" role="status"></span></div></div>`;
  }
  function initCopy(root){
    var btn = root.querySelector('.u008-btn'), cmd = root.querySelector('.u008-cmd'), tip = root.querySelector('.u008-tip'), box = root.querySelector('.u008-box');

    function write(s){
      try{ if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).then(()=>true, ()=>false); }catch(e){}
      return Promise.resolve(false);
    }
    function run(){

        if(ok) return;

      });

  function initComposer(root, onSend){

    if(S.mode==="loading"||S.mode==="local"||S.mode==="error") card.querySelector('#refNote').innerHTML = modeNotice();
    const wall = card.querySelector('#rWall');
    const docs = shared() ? S.rDocs.filter(d=>d.learned) : (local.ref ? [Object.assign({id:"local"}, local.ref)] : []);
    const cnt = {all:0,some:0,new:0}; docs.forEach(d=>{ if(cnt[d.level]!=null) cnt[d.level]++; });
    card.querySelector('#refSum').innerHTML = shared() && docs.length ? Object.entries(LV).map(([k,v])=>`<span>${v} ${cnt[k]}</span>`).join("") : "";
    if(!docs.length){ wall.innerHTML = `<p class="notice">아직 저장된 성찰이 없습니다.</p>`; return; }
    const ps = shared() ? await names(docs.map(d=>d.id)) : {};
    wall.innerHTML = "";
    docs.forEach(d=>{
      const p = ps[d.id] || {}; const mine = d.id===S.me || d.id==="local";
      const el = document.createElement('article');
      el.className = "wcard" + (mine ? " mine" : "");
      el.innerHTML = `<header><i></i><span></span></header>${LV[d.level]?`<span class="lvl ${d.level==="all"?"":esc(d.level)}">${LV[d.level]}</span>`:""}
        <p><b>오늘 찾은 답</b>${esc(d.learned||"")}</p><p><b>수업에 적용할 한 가지</b>${esc(d.apply||"")}</p>${d.next?`<p><b>이어서 탐구할 질문</b>${esc(d.next)}</p>`:""}`;
      if(p.color) el.style.setProperty('--c', p.color);
      el.querySelector('header span').textContent = mine ? "나" : (p.name || "선생님");
      wall.appendChild(el);
    });
  }
  function repaint(){
    const s = SLIDES[cur];
    if(s.ask) paintAsk();
    if(s.reflect) paintReflect();
    renderToc();
  }

  (async function connect(){
    const fallback = (mode, err)=>{ S.mode = mode; S.err = err||""; repaint(); };
    if(!window.claude || typeof window.claude.use !== "function"){ fallback("local"); return; }
    let timer = setTimeout(()=>{ if(S.mode==="loading") fallback("local"); }, 10000);
    try{
      userApi = await window.claude.use("user");
      db = await window.claude.use("db");
      if(!db || !userApi){ clearTimeout(timer); fallback("local"); return; }
      S.me = await userApi.id();
      if(!S.me){ clearTimeout(timer); fallback("local"); return; }
    }catch(e){ clearTimeout(timer); fallback("local"); return; }
    const ready = ()=>{ if(S.qReady && S.rReady){ clearTimeout(timer); S.mode = "shared"; repaint(); } };
    const onErr = e=>{ clearTimeout(timer); fallback("error", "모두의 기록을 불러오지 못했습니다. 페이지를 다시 열어 주세요."); };
    db.collection("questions").orderBy("updatedAt","desc").onSnapshot(snap=>{
      S.qDocs = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      S.qReady = true; if(S.mode==="shared") repaint(); else ready();
    }, onErr);
    db.collection("reflections").orderBy("updatedAt","desc").onSnapshot(snap=>{
      S.rDocs = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      S.rReady = true; if(S.mode==="shared") repaint(); else ready();
    }, onErr);
  })();

  /* ---- toc ---- */
  function renderToc(){
    let html = "", last = null;
    SLIDES.forEach((s,i)=>{
      if(s.section!==last){ html += `<div class="toc-sec">${esc(s.section)}</div>`; last = s.section; }
      const isSeen = seen.has(i) && i!==cur;
      let tag = s.download ? '<span class="tag">⬇ 받기</span>' : "";
      if(s.ask) tag = myItems().length ? '<span class="tag">✓ 제출</span>' : '<span class="tag write">✍️ 쓰기</span>';
      if(s.reflect) tag = myRef() ? '<span class="tag">✓ 제출</span>' : '<span class="tag write">✍️ 쓰기</span>';
      html += `<button type="button" class="toc-item${isSeen?" seen":""}${s.download?" dlrow":""}" data-i="${i}" ${i===cur?'aria-current="true"':""}>
        <span class="n">${isSeen?"✓":i+1}</span><span>${esc(fullTitle(s))}</span>${tag}</button>`;
    });
    $("tocList").innerHTML = html;
    $("seenCount").innerHTML = `<strong>${seen.size}</strong> / ${N} 장을 봤습니다`;
    const a = $("tocList").querySelector('[aria-current="true"]');
    if(a) a.scrollIntoView({block:"nearest"});
  }
  $("tocList").addEventListener("click", e=>{
    const b = e.target.closest(".toc-item"); if(!b) return;
    go(+b.dataset.i); closeToc();
  });

  /* ---- slide ---- */
  function renderSlide(){
    const s = SLIDES[cur], card = $("card");
    const isSec = s.kind==="section";
    card.className = "card" + (isSec ? " section" : " top-align");
    let head = "";
    if(isSec) head += `<span class="pill">${esc(s.icon||"✨")} ${esc(s.section)}${s.num!=null?` · ${String(s.num).padStart(2,"0")}`:""}</span>`;
    else head += `<div class="eyebrow">${esc(s.section)} · ${cur+1} / ${N}</div>`;
    head += `<h1 class="t">${esc(s.title)}${s.em?`<span class="g">${esc(s.em)}</span>`:""}</h1>`;
    if(s.lead) head += `<p class="lead">${esc(s.lead)}</p>`;
    let b = "";
    if(s.p) b += `<p>${s.p}</p>`;
    if(s.list) b += `<ul>${s.list.map(x=>`<li><span>${x}</span></li>`).join("")}</ul>`;
    if(s.steps) b += `<ol class="steps">${s.steps.map(([t,d])=>`<li><b>${esc(t)}</b><small>${esc(d)}</small></li>`).join("")}</ol>`;
    if(s.copy) b += `<div class="copy-list">${[].concat(s.copy).map(copyMarkup).join("")}</div>`;
    if(s.tip) b += `<div class="tip">${s.tip}</div>`;
    if(s.download){
      b += COURSE.downloadUrl
        ? `<a class="linkbtn" href="${esc(COURSE.downloadUrl)}" target="_blank" rel="noopener">⬇ 완성 파일 열기</a>`
        : `<span class="linkbtn disabled">⬇ 완성 파일 링크 준비 중</span>`;
    }
    if(s.ask) b += askMarkup();
    if(s.reflect) b += reflectMarkup();
    let inner = head + (b ? `<div class="body">${b}</div>` : "");
    if(s.timer) inner = `<div class="sec-grid"><div>${inner}</div><div class="timer-slot"></div></div>`;
    card.innerHTML = `<div class="in">${inner}</div>`;
    card.querySelectorAll('.u008').forEach(initCopy);
    if(s.ask) wireAsk(card);
    if(s.reflect) wireReflect(card);
    if(s.timer){
      card.querySelector('.timer-slot').appendChild(timerEl);
      timerSlide = cur;
      timerApi.prefer(s.timer);
    }
  }

  function go(i){
    if(i<0||i>=N) return;
    cur = i; seen.add(i); saveSeen();
    renderSlide(); renderToc();
    $("bar").style.width = ((i+1)/N*100)+"%";
    $("prev").disabled = i===0; $("next").disabled = i===N-1;
    secTabs.mark(sections.indexOf(SLIDES[i].section), true);
    const hash = "#s"+(i+1);
    if(location.hash!==hash) history.replaceState(null,"",hash);
    try{ localStorage.setItem(COURSE.storageKey+":cur", i); }catch(e){}
    window.scrollTo({top:0});
  }
  $("prev").onclick = ()=>go(cur-1);
  $("next").onclick = ()=>go(cur+1);
  document.addEventListener("keydown", e=>{
    if(e.target.closest("input,textarea,[contenteditable],[role=tab]")) return;
    if(e.key==="ArrowRight"){ e.preventDefault(); go(cur+1); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); go(cur-1); }
    if(e.key==="Escape") closeToc();
  });

  function openToc(){ $("toc").classList.add("open"); $("scrim").classList.add("open"); }
  function closeToc(){ $("toc").classList.remove("open"); $("scrim").classList.remove("open"); }
  $("tocBtn").onclick = openToc; $("tocClose").onclick = closeToc; $("scrim").onclick = closeToc;
  $("resetSeen").onclick = ()=>{ seen = new Set([cur]); saveSeen(); renderToc(); toast("본 기록을 지웠습니다"); };

  function fromHash(){ const m = /^#s(\d+)$/.exec(location.hash); return m ? Math.min(N, Math.max(1, +m[1]))-1 : null; }
  window.addEventListener("hashchange", ()=>{ const i=fromHash(); if(i!=null && i!==cur) go(i); });
  let start = fromHash();
  if(start==null){ try{ const v = localStorage.getItem(COURSE.storageKey+":cur"); if(v!=null) start = Math.min(N-1, +v||0); }catch(e){} }
  go(start ?? 0);
})();
</script>
